[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thermopilot"
version = "0.1.0"
description = "ThermoPilot Compute Desk: Autonomous, Cost-Aware GPU Thermal Governance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ThermoPilot Team"}
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ui = [
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thermopilot*"]
